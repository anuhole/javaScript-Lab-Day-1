       // Question 4

        // question 5

        var sum=0
        for(i=0;i<numbers.length;i++){
            sum += numbers[i]
        }
        var average=sum/numbers.length
    
        averageCount=0
        for(i=0;i<numbers.length;i++){
            if(numbers[i]>average)

        }

        console.log("Average Count "+averageCount)
