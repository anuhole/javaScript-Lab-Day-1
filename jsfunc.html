    function calculateBmi(height,weight){
        var bmi=weight/(height*height)
        var categery 
        if(bmi < 18.5){
            categery="Underweight"
        }
        else if(bmi >=18.5 && bmi <25.0){
            categery="Normal"
        }
        else if(bmi > 25.0 && bmi< 30.0)
        {
            categery="overweight"
        } 
        else if(bmi > 30.0){
            categery="Obese"
        }
        return bmi,categery
    }


    var weight =parseInt(prompt("Enter the Weight in Kg"))
    var height =parseInt(prompt("Enter the Weight in meters"))
